<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#fff7ed"/>
  <!-- Classroom Desk -->
  <rect x="50" y="180" width="400" height="120" fill="#b45309" rx="6"/>
  <rect x="60" y="190" width="380" height="15" fill="#d97706"/>

  <!-- Student 1 -->
  <circle cx="160" cy="110" r="28" fill="#fed7aa"/>
  <!-- Smile -->
  <path d="M148 120 Q160 135 172 120" stroke="#9a3412" stroke-width="3" fill="none"/>
  <!-- Eyes -->
  <circle cx="150" cy="105" r="3" fill="#0f172a"/>
  <circle cx="170" cy="105" r="3" fill="#0f172a"/>
  <!-- School Uniform -->
  <path d="M125 180 Q160 145 195 180 Z" fill="#1e3a8a"/>

  <!-- Student 2 -->
  <circle cx="340" cy="110" r="28" fill="#fed7aa"/>
  <!-- Smile -->
  <path d="M328 120 Q340 135 352 120" stroke="#9a3412" stroke-width="3" fill="none"/>
  <!-- Eyes -->
  <circle cx="330" cy="105" r="3" fill="#0f172a"/>
  <circle cx="350" cy="105" r="3" fill="#0f172a"/>
  <!-- School Uniform -->
  <path d="M305 180 Q340 145 375 180 Z" fill="#1e3a8a"/>

  <!-- Open Hot Lunch Box Dabba on Desk with Steam -->
  <g transform="translate(210, 150)">
    <rect x="0" y="20" width="80" height="40" rx="6" fill="#be123c"/>
    <circle cx="40" cy="20" r="25" fill="#facc15"/>
    <text x="40" y="25" fill="#9a3412" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Hot Meals</text>
    <!-- Steam Curves -->
    <path d="M20 10 Q25 0 20 -10" stroke="#d97706" stroke-width="2" fill="none"/>
    <path d="M40 8 Q45 -2 40 -12" stroke="#d97706" stroke-width="2" fill="none"/>
    <path d="M60 10 Q65 0 60 -10" stroke="#d97706" stroke-width="2" fill="none"/>
  </g>

  <!-- Banner Tag -->
  <rect x="150" y="280" width="200" height="35" rx="17" fill="#16a34a"/>
  <text x="250" y="302" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Lunch Time Happiness!</text>
</svg>
