<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#f8fafc"/>
  <!-- School Building Gate -->
  <rect x="50" y="30" width="400" height="120" fill="#0f172a" rx="4"/>
  <text x="250" y="75" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="20" text-anchor="middle">INTERNATIONAL SCHOOL</text>
  <text x="250" y="105" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">OFFICIAL LUNCH DROP COUNTER</text>
  
  <!-- Counter Desk -->
  <rect x="80" y="210" width="340" height="90" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <text x="250" y="255" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Classroom Desk Handover Counter</text>

  <!-- Array of Dabbas on Counter Desk -->
  <g transform="translate(120, 160)">
    <rect x="0" y="0" width="30" height="45" rx="4" fill="#be123c"/>
    <rect x="5" y="-5" width="20" height="5" fill="#d97706"/>
    <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">Class 5B</text>
  </g>

  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="30" height="45" rx="4" fill="#0f172a"/>
    <rect x="5" y="-5" width="20" height="5" fill="#fbbf24"/>
    <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">Class 6A</text>
  </g>

  <g transform="translate(220, 160)">
    <rect x="0" y="0" width="30" height="45" rx="4" fill="#94a3b8"/>
    <rect x="5" y="-5" width="20" height="5" fill="#be123c"/>
    <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="8" text-anchor="middle">Class 4C</text>
  </g>

  <!-- Delivery Partner in White shirt placing dabba -->
  <circle cx="340" cy="140" r="20" fill="#fed7aa"/>
  <path d="M315 190 Q340 165 365 190 L365 240 L315 240 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="340" y="202" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="9" text-anchor="middle">AVR DABBA</text>

  <!-- Clock showing 11:45 AM -->
  <circle cx="440" cy="80" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <line x1="440" y1="80" x2="440" y2="67" stroke="#0f172a" stroke-width="3"/>
  <line x1="440" y1="80" x2="430" y2="80" stroke="#be123c" stroke-width="3"/>
  <text x="440" y="115" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">11:45 AM</text>
</svg>
