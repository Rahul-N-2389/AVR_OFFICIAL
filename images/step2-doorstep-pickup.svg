<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#f8fafc"/>
  <!-- Home Door Frame -->
  <rect x="60" y="40" width="130" height="270" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="75" y="55" width="100" height="255" fill="#b45309"/>
  <circle cx="90" cy="180" r="6" fill="#fbbf24"/>
  
  <!-- Parent Figure inside doorway -->
  <circle cx="125" cy="110" r="22" fill="#fed7aa"/>
  <path d="M100 170 Q125 140 150 170 L150 260 L100 260 Z" fill="#be123c"/>
  
  <!-- Delivery Executive in White T-shirt with AVR DABBA -->
  <circle cx="340" cy="110" r="22" fill="#fed7aa"/>
  <path d="M310 170 Q340 140 370 170 L370 260 L310 260 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- AVR DABBA logo text on Executive T-shirt -->
  <text x="340" y="185" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle">AVR DABBA</text>
  <!-- Cap -->
  <path d="M315 95 Q340 80 365 95 L375 95 L315 95 Z" fill="#0f172a"/>

  <!-- Handover Lunch Box (Stainless Steel Dabba) -->
  <rect x="210" y="160" width="40" height="60" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <rect x="205" y="155" width="50" height="8" rx="2" fill="#cbd5e1"/>
  <line x1="230" y1="135" x2="230" y2="155" stroke="#475569" stroke-width="3"/>
  <circle cx="230" cy="132" r="5" fill="#d97706"/>

  <!-- Time Tag -->
  <rect x="180" y="275" width="140" height="35" rx="6" fill="#0f172a"/>
  <text x="250" y="297" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">9:30 AM - 11:30 AM</text>
</svg>
