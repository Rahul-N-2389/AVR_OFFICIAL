<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- AVR DABBA Team Member Center -->
  <circle cx="250" cy="110" r="30" fill="#fed7aa"/>
  <!-- Cap -->
  <path d="M215 95 Q250 75 285 95 L295 95 L215 95 Z" fill="#0f172a"/>
  <!-- Smile -->
  <path d="M238 120 Q250 132 262 120" stroke="#0f172a" stroke-width="3" fill="none"/>
  
  <!-- White T-Shirt with text "AVR DABBA" -->
  <path d="M200 190 Q250 150 300 190 L300 300 L200 300 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="250" y="210" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">AVR DABBA</text>
  <text x="250" y="228" fill="#d97706" font-family="sans-serif" font-weight="bold" font-size="9" text-anchor="middle">DELIVERY TEAM</text>

  <!-- Thumbs Up Hand Left -->
  <g transform="translate(160, 180)">
    <circle cx="20" cy="20" r="18" fill="#fed7aa" stroke="#d97706" stroke-width="2"/>
    <!-- Thumbs up icon -->
    <path d="M15 25 L15 15 Q15 8 22 8 L22 18 L27 18 Q30 22 27 26 Q25 30 18 30 Z" fill="#d97706"/>
  </g>

  <!-- Student Left -->
  <circle cx="110" cy="130" r="24" fill="#fbcfe8"/>
  <path d="M80 200 Q110 165 140 200 Z" fill="#1e3a8a"/>
  <!-- Thumbs up Right -->
  <g transform="translate(300, 180)">
    <circle cx="20" cy="20" r="18" fill="#fed7aa" stroke="#d97706" stroke-width="2"/>
    <path d="M15 25 L15 15 Q15 8 22 8 L22 18 L27 18 Q30 22 27 26 Q25 30 18 30 Z" fill="#d97706"/>
  </g>

  <!-- Student Right -->
  <circle cx="390" cy="130" r="24" fill="#fef08a"/>
  <path d="M360 200 Q390 165 420 200 Z" fill="#1e3a8a"/>

  <!-- Badge at bottom -->
  <rect x="120" y="285" width="260" height="40" rx="20" fill="#0f172a"/>
  <text x="250" y="310" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Trusted By 500+ Happy Parents!</text>
</svg>
