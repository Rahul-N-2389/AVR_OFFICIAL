<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <rect width="500" height="350" fill="#f8fafc"/>
  <rect x="180" y="30" width="140" height="280" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <rect x="190" y="55" width="120" height="230" rx="6" fill="#ffffff"/>
  <!-- Phone Notch -->
  <rect x="225" y="38" width="50" height="10" rx="5" fill="#334155"/>
  <!-- App Header -->
  <rect x="190" y="55" width="120" height="40" fill="#0f172a"/>
  <text x="250" y="80" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">AVR DABBA</text>
  <!-- Book Dabba Card inside App -->
  <rect x="200" y="105" width="100" height="60" fill="#fff7ed" stroke="#d97706" stroke-width="1.5" rx="6"/>
  <text x="250" y="130" fill="#9a3412" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Schedule Pickup</text>
  <text x="250" y="148" fill="#475569" font-family="sans-serif" font-size="8" text-anchor="middle">9:30 AM - 11:30 AM</text>
  <!-- WhatsApp Button inside App -->
  <rect x="205" y="180" width="90" height="28" rx="14" fill="#25D366"/>
  <text x="250" y="198" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Book Now</text>
  <!-- Touch Hand Graphic -->
  <circle cx="280" cy="195" r="16" fill="rgba(217, 119, 6, 0.25)"/>
  <circle cx="280" cy="195" r="8" fill="#d97706"/>
</svg>
